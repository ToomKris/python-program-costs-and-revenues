<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💰 Budget Manager</h1>
        <p class="subtitle">Manage your money by category</p>

        <div class="categories">

            <div class="category">
                <h2>🍔 Food</h2>
                <p id="Toit">0.00 €</p>
            </div>

            <div class="category">
                <h2>🚗 Transport</h2>
                <p id="Transport">0.00 €</p>
            </div>

            <div class="category">
                <h2>🏠 Household</h2>
                <p id="Majapidamine">0.00 €</p>
            </div>

            <div class="category">
                <h2>🎮 Entertainment</h2>
                <p id="Meelelahutus">0.00 €</p>
            </div>

        </div>

        <div class="buttons">
            <button onclick="lisaRaha()">➕ Add Money</button>
            <button onclick="kulutaRaha()">➖ Spend Money</button>
            <button onclick="naitaJaaki()">📊 Show Balance</button>
        </div>

        <div id="message"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
